name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm version:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
